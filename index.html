<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellas Mathe-Abenteuer</title>
    <!-- Diese Zeile lädt die Konfetti-Animation aus dem Internet -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #f0f8ff; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s;
        }
        
        #game-container {
            background: white;
            padding: 40px 60px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #ff69b4; 
            margin-top: 0;
            margin-bottom: 5px;
        }

        h2 {
            color: #9370db;
            margin-top: 0;
            font-size: 22px;
        }

        #question {
            font-size: 55px;
            margin: 20px 0;
            color: #333;
            font-weight: bold;
        }

        input {
            font-size: 40px;
            width: 120px;
            text-align: center;
            border: 4px solid #ff69b4;
            border-radius: 15px;
            padding: 10px;
            outline: none;
        }

        #feedback {
            font-size: 70px;
            height: 120px; /* Höhe erhöht für Bilder */
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Neue Klasse für Katzenbilder */
        .feedback-cat-image {
            max-height: 100px;
            border-radius: 10px;
        }

        #mistakes-container {
            margin-top: 30px;
            background: #fff3cd; 
            padding: 20px;
            border-radius: 15px;
            text-align: left;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        #mistakes-container h3 {
            margin-top: 0;
            color: #856404;
            font-size: 18px;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        li {
            font-size: 18px;
            color: #333;
            padding: 5px 0;
            border-bottom: 1px dashed #ccc;
        }
        
        li:last-child {
            border-bottom: none;
        }

        .shake-red {
            animation: shake 0.5s;
            background-color: #ffcccc !important; 
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>Mathe-Profi! 🐱</h1>
        <h2>Hallo Stella! 🌟 Viel Spaß beim Rechnen!</h2>
        
        <div id="question"></div>
        <input type="number" id="answer" autocomplete="off" autofocus>
        <br>
        <div id="feedback"></div>

        <div id="mistakes-container">
            <h3>Deine Trainings-Liste 🏋️‍♀️</h3>
            <ul id="mistakes-list">
                <li>Alles super! Keine Fehler bisher. 🥳</li>
            </ul>
        </div>
    </div>

    <script>
        let currentProblem = null;
        let mistakes = {}; 
        let correctCount = 0; // Zähler für richtige Antworten
        let incorrectCount = 0; // Zähler für falsche Antworten

        // Bildlisten (Pfade anpassen!)
        const correctCats = ['Katze1.png', 'Katze3.png', 'Katze4.png', 'Katze5.png'];
        const incorrectCats = ['Katze2.png', 'Katze6.png', 'Katze7.png'];

        function triggerConfetti() {
            confetti({
                particleCount: 150,
                spread: 100,
                origin: { y: 0.6 },
                colors: ['#ff69b4', '#9370db', '#ffd700', '#00ff00', '#00ffff']
            });
        }

        function generateProblem() {
            let mistakeKeys = Object.keys(mistakes);
            
            if (mistakeKeys.length > 0 && Math.random() < 0.4) {
                let randomKey = mistakeKeys[Math.floor(Math.random() * mistakeKeys.length)];
                currentProblem = {
                    text: randomKey,
                    answer: mistakes[randomKey].answer
                };
            } else {
                const isPlus = Math.random() > 0.5;
                let a, b, ans;
                
                if (isPlus) {
                    ans = Math.floor(Math.random() * 30) + 1; 
                    a = Math.floor(Math.random() * ans); 
                    b = ans - a;
                    currentProblem = { text: `${a} + ${b}`, answer: ans };
                } else {
                    a = Math.floor(Math.random() * 30) + 1; 
                    b = Math.floor(Math.random() * a); 
                    ans = a - b;
                    currentProblem = { text: `${a} - ${b}`, answer: ans };
                }
            }
            
            document.getElementById('question').innerText = currentProblem.text + ' = ?';
            document.getElementById('answer').value = '';
            document.getElementById('feedback').innerHTML = '';
            document.getElementById('answer').focus();
        }

        function updateMistakesUI() {
            const list = document.getElementById('mistakes-list');
            list.innerHTML = '';
            
            let sortedMistakes = Object.keys(mistakes).sort((k1, k2) => mistakes[k2].count - mistakes[k1].count);
            
            if(sortedMistakes.length === 0) {
                list.innerHTML = '<li>Alles super! Keine Fehler bisher. 🥳</li>';
            } else {
                sortedMistakes.forEach(key => {
                    let li = document.createElement('li');
                    li.innerText = `${key} (Noch ${mistakes[key].count}x üben!)`;
                    list.appendChild(li);
                });
            }
        }

        function showCatImage(catList) {
            // Wählt zufällig ein Bild aus der übergebenen Liste
            const randomCat = catList[Math.floor(Math.random() * catList.length)];
            const imgHtml = `<img src="${randomCat}" class="feedback-cat-image" alt="Belohnungs-Katze">`;
            document.getElementById('feedback').innerHTML = imgHtml;
        }

        function checkAnswer() {
            const answerInput = document.getElementById('answer').value;
            if(answerInput === '') return; 
            
            const userAnswer = parseInt(answerInput);
            const body = document.body;
            const feedback = document.getElementById('feedback');

            if (userAnswer === currentProblem.answer) {
                correctCount++; // Zähler erhöhen
                
                // Prüfen auf jede 5. richtige Antwort
                if (correctCount % 5 === 0) {
                    showCatImage(correctCats);
                } else {
                    // Standard-Feedback (Emojis)
                    const catsAndApplause = ['🐱👏', '😻✨', '😸🎉', '👏👏👏', '🐈❤️', '🏆😻'];
                    const randomFeedback = catsAndApplause[Math.floor(Math.random() * catsAndApplause.length)];
                    feedback.innerHTML = randomFeedback;
                }
                
                let mistakeCountBefore = Object.keys(mistakes).length;
                
                if (mistakes[currentProblem.text]) {
                    mistakes[currentProblem.text].count--;
                    if (mistakes[currentProblem.text].count <= 0) {
                        delete mistakes[currentProblem.text]; 
                    }
                    updateMistakesUI();
                }

                let mistakeCountAfter = Object.keys(mistakes).length;
                if (mistakeCountBefore > 0 && mistakeCountAfter === 0) {
                    triggerConfetti();
                }

                setTimeout(generateProblem, 2000); 
            } else {
                incorrectCount++; // Zähler erhöhen
                
                // Prüfen auf jede 3. falsche Antwort
                if (incorrectCount % 3 === 0) {
                    showCatImage(incorrectCats);
                } else {
                    // Standard-Fehler-Feedback
                    feedback.innerHTML = '❌'; 
                }
                
                if (!mistakes[currentProblem.text]) {
                    mistakes[currentProblem.text] = { answer: currentProblem.answer, count: 1 };
                } else {
                    mistakes[currentProblem.text].count++;
                }
                updateMistakesUI();

                body.classList.add('shake-red');
                
                setTimeout(() => {
                    body.classList.remove('shake-red');
                    feedback.innerHTML = ''; 
                }, 500); 
                
                document.getElementById('answer').value = '';
                document.getElementById('answer').focus();
            }
        }

        document.getElementById('answer').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkAnswer();
        });

        generateProblem();
    </script>
</body>
</html>
