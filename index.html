<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellas Magisches Mathe-Abenteuer</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background: linear-gradient(-45deg, #f0f8ff, #e6e6fa, #fff0f5, #e0ffff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        #game-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 60px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(147, 112, 219, 0.3), 0 0 20px rgba(255, 105, 180, 0.2);
            text-align: center;
            max-width: 500px;
            width: 100%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            color: #ff69b4; 
            margin-top: 0;
            margin-bottom: 5px;
            animation: textGlow 3s infinite alternate;
        }

        @keyframes textGlow {
            from { text-shadow: 0 0 5px #fff, 0 0 10px #ff69b4; }
            to { text-shadow: 0 0 10px #fff, 0 0 20px #ff69b4, 0 0 30px #9370db; }
        }

        h2 {
            color: #9370db;
            margin-top: 0;
            font-size: 22px;
        }

        #question {
            font-size: 55px;
            margin: 20px 0;
            color: #333;
            font-weight: bold;
        }

        input {
            font-size: 40px;
            width: 120px;
            text-align: center;
            border: 4px solid #ff69b4;
            border-radius: 15px;
            padding: 10px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #9370db;
            box-shadow: 0 0 15px rgba(147, 112, 219, 0.6);
        }

        button {
            font-size: 28px;
            background: linear-gradient(45deg, #ff69b4, #9370db);
            color: white;
            border: 2px solid white;
            padding: 15px 30px;
            border-radius: 15px;
            cursor: pointer;
            margin-top: 25px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.4);
            transition: all 0.2s ease;
        }

        button:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 8px 25px rgba(147, 112, 219, 0.6);
        }

        button:active {
            transform: scale(0.95);
        }

        #feedback {
            font-size: 70px;
            height: 120px; 
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        #cat-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        #cat-overlay img {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 30px;
            box-shadow: 0 0 50px rgba(255, 105, 180, 0.8), 0 0 100px rgba(147, 112, 219, 0.5);
            animation: zoomPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes zoomPop {
            0% { transform: scale(0.1) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.1) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        #mistakes-container {
            margin-top: 30px;
            background: rgba(255, 243, 205, 0.8); 
            backdrop-filter: blur(5px);
            padding: 20px;
            border-radius: 15px;
            text-align: left;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 1px solid #ffeeba;
        }

        #mistakes-container h3 {
            margin-top: 0;
            color: #856404;
            font-size: 18px;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        li {
            font-size: 18px;
            color: #333;
            padding: 5px 0;
            border-bottom: 1px dashed #ccc;
        }
        
        li:last-child {
            border-bottom: none;
        }

        .shake-red {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); background-color: #ffe6e6; }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); background-color: #ffcccc; }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); background-color: transparent; }
        }
    </style>
</head>
<body>

    <div id="cat-overlay"></div>

    <div id="game-container">
        <h1>Mathe-Profi! ✨🐱✨</h1>
        <h2>Hallo Stella! 🌟 Viel Spaß beim Rechnen!</h2>
        
        <div id="question"></div>
        <input type="number" id="answer" autocomplete="off" autofocus>
        <br>
        <button onclick="checkAnswer()">Prüfen! ✨</button>
        <div id="feedback"></div>

        <div id="mistakes-container">
            <h3>Deine Trainings-Liste 🪄</h3>
            <ul id="mistakes-list">
                <li>Alles super! Keine Fehler bisher. 🥳</li>
            </ul>
        </div>
    </div>

    <script>
        let currentProblem = null;
        let mistakes = {}; 
        let correctCount = 0; 
        let incorrectCount = 0; 

        const correctCats = ['Katze1.jpg', 'Katze3.png', 'Katze4.png', 'Katze5.png'];
        const incorrectCats = ['Katze2.png', 'Katze6.png', 'Katze7.png'];

        // PRELOADER: Lädt die Bilder unsichtbar vor, damit sie auf dem Handy sofort da sind
        const allCatsToPreload = correctCats.concat(incorrectCats);
        allCatsToPreload.forEach(imageSrc => {
            const img = new Image();
            img.src = imageSrc;
        });

        function triggerConfetti() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
              return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();

              if (timeLeft <= 0) {
                return clearInterval(interval);
              }

              var particleCount = 50 * (timeLeft / duration);
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        function generateProblem() {
            let mistakeKeys = Object.keys(mistakes);
            
            if (mistakeKeys.length > 0 && Math.random() < 0.4) {
                let randomKey = mistakeKeys[Math.floor(Math.random() * mistakeKeys.length)];
                currentProblem = {
                    text: randomKey,
                    answer: mistakes[randomKey].answer
                };
            } else {
                const isPlus = Math.random() > 0.5;
                let a, b, ans;
                
                if (isPlus) {
                    ans = Math.floor(Math.random() * 30) + 1; 
                    a = Math.floor(Math.random() * ans); 
                    b = ans - a;
                    currentProblem = { text: `${a} + ${b}`, answer: ans };
                } else {
                    a = Math.floor(Math.random() * 30) + 1; 
                    b = Math.floor(Math.random() * a); 
                    ans = a - b;
                    currentProblem = { text: `${a} - ${b}`, answer: ans };
                }
            }
            
            document.getElementById('question').innerText = currentProblem.text + ' = ?';
            document.getElementById('answer').value = '';
            
            const feedbackEl = document.getElementById('feedback');
            feedbackEl.innerHTML = '';
            feedbackEl.style.animation = 'none';
            feedbackEl.offsetHeight; 
            feedbackEl.style.animation = null; 
            
            document.getElementById('answer').focus();
        }

        function updateMistakesUI() {
            const list = document.getElementById('mistakes-list');
            list.innerHTML = '';
            
            let sortedMistakes = Object.keys(mistakes).sort((k1, k2) => mistakes[k2].count - mistakes[k1].count);
            
            if(sortedMistakes.length === 0) {
                list.innerHTML = '<li>Alles super! Keine Fehler bisher. 🥳</li>';
            } else {
                sortedMistakes.forEach(key => {
                    let li = document.createElement('li');
                    li.innerText = `${key} (Noch ${mistakes[key].count}x üben!)`;
                    list.appendChild(li);
                });
            }
        }

        function showBigCatImage(catList) {
            const randomCat = catList[Math.floor(Math.random() * catList.length)];
            const overlay = document.getElementById('cat-overlay');
            overlay.innerHTML = `<img src="${randomCat}" alt="Riesige Belohnungs-Katze">`;
            overlay.style.display = 'flex'; 
            
            // Auf 4 Sekunden (4000 Millisekunden) erhöht
            setTimeout(() => {
                overlay.style.display = 'none';
                overlay.innerHTML = '';
            }, 4000);
        }

        function checkAnswer() {
            const answerInput = document.getElementById('answer').value;
            if(answerInput === '') return; 
            
            const userAnswer = parseInt(answerInput);
            const body = document.body;
            const feedback = document.getElementById('feedback');

            if (userAnswer === currentProblem.answer) {
                correctCount++; 
                let delayForNextQuestion = 2000;
                
                if (correctCount % 5 === 0) {
                    showBigCatImage(correctCats);
                    delayForNextQuestion = 4000; // Wenn eine Katze gezeigt wird, 4 Sekunden warten
                } else {
                    const catsAndApplause = ['🐱👏', '😻✨', '😸🎉', '👏👏👏', '🐈❤️', '🏆😻', '✨🪄✨'];
                    const randomFeedback = catsAndApplause[Math.floor(Math.random() * catsAndApplause.length)];
                    feedback.innerHTML = randomFeedback;
                }
                
                let mistakeCountBefore = Object.keys(mistakes).length;
                
                if (mistakes[currentProblem.text]) {
                    mistakes[currentProblem.text].count--;
                    if (mistakes[currentProblem.text].count <= 0) {
                        delete mistakes[currentProblem.text]; 
                    }
                    updateMistakesUI();
                }

                let mistakeCountAfter = Object.keys(mistakes).length;
                if (mistakeCountBefore > 0 && mistakeCountAfter === 0) {
                    triggerConfetti();
                }

                setTimeout(generateProblem, delayForNextQuestion); 
            } else {
                incorrectCount++; 
                let isCatShown = false;
                
                if (incorrectCount % 3 === 0) {
                    showBigCatImage(incorrectCats);
                    isCatShown = true;
                } else {
                    feedback.innerHTML = '❌'; 
                }
                
                if (!mistakes[currentProblem.text]) {
                    mistakes[currentProblem.text] = { answer: currentProblem.answer, count: 1 };
                } else {
                    mistakes[currentProblem.text].count++;
                }
                updateMistakesUI();

                body.classList.add('shake-red');
                
                setTimeout(() => {
                    body.classList.remove('shake-red');
                    if (incorrectCount % 3 !== 0) {
                         feedback.innerHTML = ''; 
                    }
                }, 500); 
                
                if (isCatShown) {
                    // Wenn eine Fehler-Katze gezeigt wird, 4 Sekunden warten, bevor die nächste Aufgabe kommt
                    setTimeout(generateProblem, 4000);
                } else {
                    document.getElementById('answer').value = '';
                    document.getElementById('answer').focus();
                }
            }
        }

        document.getElementById('answer').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkAnswer();
        });

        generateProblem();
    </script>
</body>
</html>
